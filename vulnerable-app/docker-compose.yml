# KICS: multiple container misconfigurations. Intentionally insecure.
version: "3"
services:
  app:
    build: .
    privileged: true                 # KICS: privileged container
    network_mode: host               # KICS: host network
    ports:
      - "3000:3000"
    environment:
      DB_PASSWORD: "Sup3rS3cr3tR00tP@ss!"   # secret in plaintext
      JWT_SECRET: "hardcoded-jwt-signing-key-do-not-change"
    volumes:
      - "/:/host"                    # KICS: mounting host root
      - "/var/run/docker.sock:/var/run/docker.sock"  # docker socket exposure
    cap_add:
      - ALL                          # KICS: all capabilities added
    security_opt:
      - "seccomp:unconfined"         # KICS: seccomp disabled

  db:
    image: mysql:5.5                 # outdated image
    environment:
      MYSQL_ROOT_PASSWORD: root      # weak root password
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"                  # DB exposed to host
