<!DOCTYPE html>
<!-- Client-side vulnerabilities for Checkmarx SAST (JS). Intentionally insecure. -->
<html>
<head>
  <title>Dashboard</title>
  <!-- A06: vulnerable client library loaded from CDN, no SRI -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
</head>
<body>
  <div id="content"></div>
  <a id="link">click</a>
  <script>
    // A02: client-side embedded API keys
    var GOOGLE_MAPS_KEY = "AIzaSyEXAMPLE-Google-Maps-Api-Key-123456";
    var STRIPE_PUB = "pk_live_ExamplePublishableKey000000";

    // DOM XSS: location.hash written to innerHTML
    var frag = decodeURIComponent(location.hash.slice(1));
    document.getElementById("content").innerHTML = frag; // DOM XSS sink

    // DOM XSS via document.write of query param
    var params = new URLSearchParams(location.search);
    document.write("Welcome " + params.get("user")); // DOM XSS

    // DOM XSS via jQuery html() with untrusted input
    $("#content").html(params.get("msg"));

    // Open redirect / javascript: sink
    document.getElementById("link").href = params.get("next"); // tainted href

    // eval of URL param
    eval(params.get("code")); // client-side code injection

    // Insecure postMessage: no origin check
    window.addEventListener("message", function (e) {
      document.body.innerHTML += e.data; // trusts any origin -> XSS
    });
  </script>
</body>
</html>
