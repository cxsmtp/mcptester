# Hardened compose: no privilege, no host mounts, secrets via env files, DB not exposed.
version: "3.8"
services:
  app:
    build: .
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    user: "1000:1000"
    ports:
      - "127.0.0.1:3000:3000"   # bound to loopback, not all interfaces
    env_file:
      - .env                    # provided at deploy time, gitignored
    networks:
      - internal

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    networks:
      - internal                # not published to the host

networks:
  internal:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt   # outside VCS
